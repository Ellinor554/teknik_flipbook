<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teknik</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #a0b4d6;
      text-transform: uppercase;
    }

    /* ---- Book container ---- */
    .viewer {
      position: relative;
      width: 100%;
      max-width: 1000px;
    }

    .book {
      position: relative;
      width: 100%;
      aspect-ratio: 2290 / 1313;
      background: #fff;
      border-radius: 2px;
      box-shadow:
        0 2px 8px rgba(0,0,0,.5),
        0 12px 32px rgba(0,0,0,.7);
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* ---- Navigation arrows ---- */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 72px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      z-index: 10;
      user-select: none;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.18); }
    .nav-btn:active { transform: translateY(-50%) scale(0.95); }
    .nav-btn.disabled { opacity: 0.2; cursor: default; pointer-events: none; }

    #btn-prev { left: -60px; }
    #btn-next { right: -60px; }

    /* ---- Bottom bar ---- */
    .bottom-bar {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .page-info {
      font-size: 0.95rem;
      color: #8899bb;
      min-width: 100px;
      text-align: center;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .dot.active {
      background: #6a9fd8;
      transform: scale(1.3);
    }

    .dot:hover { background: rgba(255,255,255,0.5); }

    /* ---- Keyboard hint ---- */
    .hint {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      text-align: center;
    }

    /* ---- Responsive: hide side arrows when no room ---- */
    @media (max-width: 780px) {
      #btn-prev { left: 4px; }
      #btn-next { right: 4px; }
      .nav-btn { background: rgba(0,0,0,0.5); }
    }
  </style>
</head>
<body>

  <h1>Teknik</h1>

  <div class="viewer">
    <button class="nav-btn disabled" id="btn-prev" aria-label="Föregående sida">&#8592;</button>

    <div class="book" id="book">
      <div class="page active" data-page="1"><img src="images/page-01.png" alt="Sida 1"></div>
      <div class="page" data-page="2"><img src="images/page-02.png" alt="Sida 2"></div>
      <div class="page" data-page="3"><img src="images/page-03.png" alt="Sida 3"></div>
      <div class="page" data-page="4"><img src="images/page-04.png" alt="Sida 4"></div>
      <div class="page" data-page="5"><img src="images/page-05.png" alt="Sida 5"></div>
      <div class="page" data-page="6"><img src="images/page-06.png" alt="Sida 6"></div>
      <div class="page" data-page="7"><img src="images/page-07.png" alt="Sida 7"></div>
    </div>

    <button class="nav-btn" id="btn-next" aria-label="Nästa sida">&#8594;</button>
  </div>

  <div class="bottom-bar">
    <div class="dots" id="dots"></div>
  </div>
  <div class="page-info" id="page-info">Sida 1 av 7</div>
  <p class="hint">← → piltangenter &nbsp;|&nbsp; klicka på punkterna för att hoppa</p>

  <script>
    const pages = document.querySelectorAll('.page');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageInfo = document.getElementById('page-info');
    const dotsContainer = document.getElementById('dots');
    const total = pages.length;
    let current = 0;

    // Build dots
    pages.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
    });

    function goTo(index) {
      pages[current].classList.remove('active');
      dotsContainer.children[current].classList.remove('active');
      current = index;
      pages[current].classList.add('active');
      dotsContainer.children[current].classList.add('active');
      pageInfo.textContent = `Sida ${current + 1} av ${total}`;
      btnPrev.classList.toggle('disabled', current === 0);
      btnNext.classList.toggle('disabled', current === total - 1);
    }

    btnPrev.addEventListener('click', () => { if (current > 0) goTo(current - 1); });
    btnNext.addEventListener('click', () => { if (current < total - 1) goTo(current + 1); });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   { e.preventDefault(); if (current > 0) goTo(current - 1); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); if (current < total - 1) goTo(current + 1); }
    });

    // Touch/swipe support
    let touchStartX = 0;
    document.getElementById('book').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.getElementById('book').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) {
        if (dx < 0 && current < total - 1) goTo(current + 1);
        if (dx > 0 && current > 0) goTo(current - 1);
      }
    });
  </script>
</body>
</html>
